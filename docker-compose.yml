version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product
    container_name: shopsphere-product
    ports:
      - "8000:8000"
    environment:
      - USE_REDIS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    container_name: shopsphere-user
    ports:
      - "8001:8001"
    environment:
      - USE_REDIS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=supersecret
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order
    container_name: shopsphere-order
    ports:
      - "8002:8002"
    environment:
      - USE_REDIS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

networks:
  shopsphere-network:
    driver: bridge

volumes:
  redis_data:
