upstream product_service {
    least_conn;
    server product-service-1:8000 max_fails=3 fail_timeout=30s;
    server product-service-2:8000 max_fails=3 fail_timeout=30s;
}

upstream user_service {
    least_conn;
    server user-service-1:8001 max_fails=3 fail_timeout=30s;
    server user-service-2:8001 max_fails=3 fail_timeout=30s;
}

upstream order_service {
    least_conn;
    server order-service-1:8002 max_fails=3 fail_timeout=30s;
    server order-service-2:8002 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost;

    location /api/products {
        proxy_pass http://product_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/users {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/orders {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
