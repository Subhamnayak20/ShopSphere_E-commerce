apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  USE_REDIS: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PRODUCT_SERVICE_URL: "http://product-service:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  jwt-secret: "supersecret"
  redis-password: ""
